<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý Excel</title>
<style>
  :root{
    --bg:#ffffff; --sidebar:#f7f7f5; --line:#e8e6e1; --ink:#1f1e1d;
    --muted:#6b6a67; --accent:#d97757; --bubble:#f0eee6; --hover:#ecebe7;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink); background:var(--bg); display:flex; height:100vh; overflow:hidden;
  }
  /* ---------- Sidebar ---------- */
  aside{
    width:264px; flex:0 0 264px; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:12px;
  }
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;font-weight:600;font-size:15px}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .newchat{
    display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;margin-bottom:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;
    font-size:14px;color:var(--ink);
  }
  .newchat:hover{background:var(--hover)}
  .convs{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
  .conv{padding:8px 10px;border-radius:8px;font-size:13.5px;color:#3d3c3a;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv:hover{background:var(--hover)}
  .conv.active{background:var(--hover);font-weight:500}
  .sidefoot{padding:8px;font-size:11.5px;color:var(--muted)}
  /* ---------- Main ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  #log{flex:1;overflow-y:auto;padding:26px 0}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .msg{margin-bottom:22px;line-height:1.65;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--bubble);padding:10px 14px;border-radius:14px;max-width:80%;white-space:pre-wrap}
  .msg.bot .who{font-weight:600;font-size:12.5px;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
  .caret{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-3px;
    animation:bl 1s steps(2,start) infinite}
  @keyframes bl{50%{opacity:0}}
  .think{color:var(--muted);font-size:13px;font-style:italic}
  .empty{color:var(--muted);text-align:center;margin-top:18vh;font-size:15px;line-height:1.8}
  .empty b{color:var(--ink)}
  /* ---------- Composer ---------- */
  .composer{padding:12px 20px 20px}
  .cbox{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
    border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .cbox:focus-within{border-color:#d8d5cf}
  textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:15px;max-height:180px;
    padding:8px 0;background:transparent;color:var(--ink)}
  button.send{border:0;background:var(--accent);color:#fff;width:34px;height:34px;border-radius:10px;
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  button.send:disabled{opacity:.4;cursor:default}
  .hint{max-width:760px;margin:8px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="dot">⎘</span> Trợ lý Excel</div>
  <button class="newchat" id="new">＋ Cuộc trò chuyện mới</button>
  <div class="convs" id="convs"></div>
  <div class="sidefoot">Chấm công · Theo dõi kho · Xử lý .xlsx</div>
</aside>

<main>
  <header id="head">Cuộc trò chuyện mới</header>
  <div id="log"><div class="wrap" id="wrap">
    <div class="empty" id="empty">
      <b>Trợ lý Excel</b><br>
      Gõ việc bằng tiếng Việt — ví dụ:<br>
      “đọc data/timesheet_741046.xlsx rồi xử lý chấm công”
    </div>
  </div></div>
  <div class="composer">
    <div class="cbox">
      <textarea id="ta" rows="1" placeholder="Nhắn cho trợ lý… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <button class="send" id="send" title="Gửi">↑</button>
    </div>
    <div class="hint">Trợ lý có thể đọc/ghi file Excel trong thư mục app · Gõ “/login” trong app nếu chưa có API key</div>
  </div>
</main>

<script>
let conv = null, busy = false, titles = {};

const $ = (s) => document.querySelector(s);
const log = $("#wrap"), ta = $("#ta"), btn = $("#send");

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function addUser(text){
  $("#empty") && $("#empty").remove();
  const d = document.createElement("div");
  d.className = "msg user";
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text;
  d.appendChild(b); log.appendChild(d);
}
function addBot(){
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = '<div class="who">TRỢ LÝ</div><div class="body"></div>';
  log.appendChild(d);
  return d.querySelector(".body");
}
function scroll(){ const l = $("#log"); l.scrollTop = l.scrollHeight; }

function head(){ $("#head").textContent = conv ? (titles[conv] || conv) : "Cuộc trò chuyện mới"; }

async function loadConvs(){
  const box = $("#convs"); box.innerHTML = "";
  try{
    const r = await fetch("/api/convs"); const arr = await r.json();
    arr.forEach(c => {
      titles[c.id] = c.title;
      const el = document.createElement("div");
      el.className = "conv" + (c.id === conv ? " active" : "");
      el.textContent = c.title || c.id; el.title = c.title || c.id;
      el.onclick = () => openConv(c.id);
      box.appendChild(el);
    });
    head();
  }catch(e){}
}

async function openConv(id){
  conv = id; head();
  log.innerHTML = '<div class="empty" id="empty">Đang tải…</div>';
  try{
    const r = await fetch("/api/history?conv=" + encodeURIComponent(id));
    const arr = await r.json();
    log.innerHTML = "";
    arr.forEach(m => { if (m.role === "user") addUser(m.text); else addBot().textContent = m.text; });
    if (!arr.length) log.innerHTML = '<div class="empty" id="empty">Chưa có tin nhắn.</div>';
    scroll();
  }catch(e){}
  loadConvs();
}

async function send(){
  const text = ta.value.trim();
  if (!text || busy) return;
  busy = true; btn.disabled = true;
  ta.value = ""; ta.style.height = "auto";
  addUser(text);
  const body = addBot();
  body.innerHTML = '<span class="think">đang suy nghĩ…</span>';
  scroll();

  try{
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message: text, conv})
    });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = "", first = true, out = "";
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith("data: ")) continue;
        let ev; try{ ev = JSON.parse(chunk.slice(6)); }catch(e){ continue; }
        if (ev.type === "start"){ if (!conv){ conv = ev.conv; head(); } }
        else if (ev.type === "delta"){ 
          if (first){ body.innerHTML = ""; first = false; }
          out += ev.text; body.textContent = out;
          body.insertAdjacentHTML("beforeend", '<span class="caret"></span>');
          scroll();
        }
        else if (ev.type === "error"){ body.innerHTML = '<span class="think">⚠ ' + esc(ev.text) + '</span>'; first = false; }
        else if (ev.type === "done"){
          if (first){ body.innerHTML = '<span class="think">(không có nội dung trả về)</span>'; }
          else body.textContent = out;
        }
      }
    }
  }catch(e){ body.innerHTML = '<span class="think">⚠ Lỗi kết nối: ' + esc(String(e)) + '</span>'; }
  busy = false; btn.disabled = false; ta.focus();
  loadConvs(); scroll();
}

$("#new").onclick = () => { conv = null; $("#head").textContent = "Cuộc trò chuyện mới";
  log.innerHTML = '<div class="empty" id="empty">Gõ việc cần làm ở ô dưới.</div>';
  loadConvs(); ta.focus(); };
btn.onclick = send;
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; });

loadConvs(); ta.focus();
</script>
</body>
</html>
